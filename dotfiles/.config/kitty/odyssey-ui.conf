# Odyssey local revision. User overrides are included AFTER this file.
background #191918
foreground #e3e0dc
cursor #e3e0dc
cursor_text_color #191918
selection_foreground #191918
selection_background #d5d3d0
url_color #c3b29b
url_style single
window_padding_width 10
active_border_color #918a81
inactive_border_color #494641
window_border_width 1
tab_bar_style custom
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_margin_width 8
tab_bar_margin_height 0 0
tab_bar_background #191918
active_tab_foreground #f2f1ef
active_tab_background #2b2926
inactive_tab_foreground #a8a29b
inactive_tab_background #191918
active_tab_font_style bold
inactive_tab_font_style normal
enabled_layouts splits,stack,tall,grid
color0 #191918
color1 #ed858d
color2 #a4bb93
color3 #d3b78d
color4 #9ab4ce
color5 #b7a1bd
color6 #9abfba
color7 #d5d3d0
color8 #85817c
color9 #f59ba1
color10 #bed2af
color11 #e6cda5
color12 #b6cee5
color13 #d0b8d4
color14 #b2d6d0
color15 #f2f1ef
map ctrl+shift+space kitten odyssey-launch.py
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
