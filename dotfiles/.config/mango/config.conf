# Mango 0.17.1 (Odyssey) — adaptado de cadrocspace (mangowm-git/Arch).
# Sintaxe conferida com /etc/mango/config.conf e `mango -p`.

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation (zoom/slide)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.5
zoom_end_ratio=0.7
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=300
animation_duration_tag=400
animation_duration_close=350
animation_duration_focus=350
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller
scroller_structs=10
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview
hotarea_size=5
hotarea_corner=1
enable_hotarea=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focusdir_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_hide_timeout=1
cursor_hide_on_keypress=1
drag_tile_to_tile=1
drag_tile_small=1

# Teclado: mantém o layout injetado pelo Odyssey (ODY-238).
repeat_rate=25
repeat_delay=300
numlockon=1
source-optional=~/.config/mango/odyssey-keyboard.conf

# Trackpad (requer relogin)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse (requer relogin)
mouse_natural_scrolling=0
mouse_left_handed=0
mouse_middle_button_emulation=0

# Gaps
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4

# Layout por tag (tile/scroller/deck/dwindle/monocle — suportados no 0.17.1)
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:monocle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:deck
tagrule=id:8,layout_name:monocle
tagrule=id:9,layout_name:tile

# Autostart — launcher via fuzzel.
exec-once=/usr/libexec/polkit-kde-authentication-agent-1
exec-once=~/.local/bin/waybar-mango -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once=swaync
exec-once=/usr/bin/xdg-user-dirs-update
exec-once=~/.config/scripts/random-wallpaper.sh
exec-once=/usr/bin/odyssey-welcome-autostart
exec-once=xbps-gui-tray
exec-once=/usr/libexec/xdg-desktop-portal-wlr

# Sub-configs
source=~/.config/mango/bind.conf
source=~/.config/mango/rule.conf
source=~/.config/mango/theme.conf
source=~/.config/mango/env.conf

# XF86MonBrightness / XF86Audio: binds mantidos apenas em bind.conf
