# Regras de janela — adaptado de cadrocspace/.config/mango/rule.conf
# Sintaxe do mango 0.17.1: windowrule (não window_rule), appid (não app_id),
# isfloating (não is_floating). width/height não existem aqui; só offsets.
# Sem regras de monitor específicas (eDP-1/HDMI-A-1) nem apps ausentes.

windowrule=force_fakemaximize:1,appid:org.telegram.desktop
windowrule=isfloating:1,title:^Satty

windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:localsend
windowrule=isfloating:1,appid:nmtui
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:thunar

# layer rules (mango 0.17.1: noblur/noanim)
layerrule=noblur:1,noanim:1,layer_name:selection
layerrule=noblur:1,noanim:1,layer_name:launcher
